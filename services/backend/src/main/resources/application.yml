spring:
  application:
    name: agroadvisor-backend
  profiles:
    default: local
  data:
    redis:
      # Short timeouts: with Redis down a request must fall back to the database quickly, not wait 60 s
      timeout: 500ms
      connect-timeout: 1s
  cache:
    type: redis
    cache-names: catalog # every cache is listed here so that CacheReset knows it at start-up
    redis:
      key-prefix: 'agroadvisor:'
      # Admin edits evict the cache and a restart clears it; the TTL only bounds a rare read/evict race
      time-to-live: 15m
  servlet:
    multipart:
      # A photo is up to 10 MB (DiagnosisService); the default limit is 1 MB
      max-file-size: 10MB
      max-request-size: 11MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # schema is owned by Flyway migrations in db/migration

app:
  version: '@project.version@'
  photos:
    # S3-compatible server from infra/ (SeaweedFS); keys come from the environment, never from git
    endpoint: ${S3_ENDPOINT:http://localhost:8333}
    bucket: ${S3_BUCKET:diagnosis-photos}
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}
  ai:
    # http: the AI service (docs/api/ai-predict.md); stub: a fake that answers "healthy" (experiments only)
    client: ${AI_CLIENT:http}
    url: ${AI_SERVICE_URL:http://localhost:8000}
    connect-timeout: 2s
    read-timeout: 10s # inference takes ~100 ms on a CPU (p95 172 ms)
    retries: 1 # only for a service that is down or not ready; never after a read timeout or a 500
    retry-delay: 400ms # a model that is still loading gets a moment before the retry
    # An answer of the placeholder model (model_version "placeholder...") is refused as 503 ai_unavailable;
    # true only in the local and test profiles
    allow-placeholder: false
  diagnosis:
    # How long a request with an Idempotency-Key holds its claim before another request may take it over.
    # It must exceed the longest time one request can take, counted from the claim to the end of the
    # finalizing transaction (DiagnosisClaimConfig refuses to start otherwise; the same sum is in RequestDeadline):
    #   metadata stripping, budget (byte scan of <= 10 MB, no decoding) .................   2 s
    #   photo upload, app.photos.total-timeout (all tries of one call) ................... 25 s
    #   model call, (connect 2 s + read 10 s) x (1 retry + 1) + 0.4 s pause ............. 24.4 s
    #   finalizing transaction, waiting for a pool connection (hikari default 30 s) ...... 30 s
    #   its two statements, budget .......................................................   1 s
    #   ------------------------------------------------------------------------------------------
    #   total ........................................................................... 82.4 s
    # 90 s leaves 7.6 s for pauses of the JVM and the host. A request that still outlives its claim cannot
    # do harm: its claim is fenced (claim_id), the unique index of diagnoses keeps one result, and its photo
    # object has the same name and the same bytes as the new owner's. Not counted: the rate limiter and the
    # lookups, which run before the claim.
    claim-timeout: 90s
  meta:
    cache-ttl: 60s # how long GET /api/meta keeps the answer of the AI service
  rate-limit:
    diagnosis-per-minute: 5 # photos per user per minute; there are no daily limits
  security:
    jwt:
      # Base64, at least 32 random bytes (openssl rand -base64 48). Kept outside git; startup fails without it.
      secret: ${JWT_SECRET:}

management:
  health:
    redis:
      # Redis is an accelerator, not a dependency: without it the service degrades, so it must not turn health DOWN
      enabled: false
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true

# API docs are off unless a profile turns them on (local, test); they are not served in production
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
    path: /swagger-ui.html

server:
  port: ${SERVER_PORT:8080}
