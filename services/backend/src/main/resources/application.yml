spring:
  application:
    name: agroadvisor-backend
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # schema is owned by Flyway migrations in db/migration

app:
  version: '@project.version@'
  security:
    jwt:
      # Base64, at least 32 random bytes (openssl rand -base64 48). Kept outside git; startup fails without it.
      secret: ${JWT_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true

# API docs are off unless a profile turns them on (local, test); they are not served in production
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
    path: /swagger-ui.html

server:
  port: ${SERVER_PORT:8080}
