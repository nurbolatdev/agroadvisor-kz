spring:
  application:
    name: agroadvisor-backend
  data:
    redis:
      # Short timeouts: with Redis down a request must fall back to the database quickly, not wait 60 s
      timeout: 500ms
      connect-timeout: 1s
  cache:
    type: redis
    cache-names: catalog,regions # every cache is listed here so that CacheReset knows it at start-up
    redis:
      key-prefix: 'agroadvisor:'
      # Admin edits evict the cache and a restart clears it; the TTL only bounds a rare read/evict race
      time-to-live: 15m
  servlet:
    multipart:
      # A photo is up to 10 MB (DiagnosisService); the default limit is 1 MB
      max-file-size: 10MB
      max-request-size: 11MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # schema is owned by Flyway migrations in db/migration

app:
  version: '@project.version@'
  photos:
    # S3-compatible server from infra/ (SeaweedFS); keys come from the environment, never from git
    endpoint: ${S3_ENDPOINT:http://localhost:8333}
    bucket: ${S3_BUCKET:diagnosis-photos}
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}
    # Removes photo objects no diagnosis points to (issue #69). The bucket is not versioned, so a deletion is
    # final: dry-run stays on until the first nights have been checked by hand (docs/adr/0002-orphan-photo-cleanup.md).
    orphan-cleanup:
      enabled: ${APP_PHOTOS_ORPHAN_CLEANUP_ENABLED:true}
      dry-run: ${APP_PHOTOS_ORPHAN_CLEANUP_DRY_RUN:true}
      min-age: ${APP_PHOTOS_ORPHAN_CLEANUP_MIN_AGE:PT24H} # must exceed claim-timeout and the 1 h cleanup of claims
      cron: ${APP_PHOTOS_ORPHAN_CLEANUP_CRON:0 30 3 * * *} # Asia/Almaty
      batch-size: ${APP_PHOTOS_ORPHAN_CLEANUP_BATCH_SIZE:500}
      max-deletes-per-run: ${APP_PHOTOS_ORPHAN_CLEANUP_MAX_DELETES_PER_RUN:500}
      max-orphan-ratio: ${APP_PHOTOS_ORPHAN_CLEANUP_MAX_ORPHAN_RATIO:0.2} # above this share of old objects: abort
  ai:
    # http: the AI service (docs/api/ai-predict.md); stub: a fake that answers "healthy" (experiments only)
    client: ${AI_CLIENT:http}
    url: ${AI_SERVICE_URL:http://localhost:8000}
    connect-timeout: 2s
    read-timeout: 10s # inference takes ~100 ms on a CPU (p95 172 ms)
    retries: 1 # only for a service that is down or not ready; never after a read timeout or a 500
    retry-delay: 400ms # a model that is still loading gets a moment before the retry
    # An answer of the placeholder model (model_version "placeholder...") is refused as 503 ai_unavailable;
    # true only in the local and test profiles
    allow-placeholder: false
  diagnosis:
    # How long a request with an Idempotency-Key holds its claim before another request may take it over.
    # It must exceed the longest time one request can take, counted from the claim to the end of the
    # finalizing transaction (DiagnosisClaimConfig refuses to start otherwise; the same sum is in RequestDeadline):
    #   metadata stripping, budget (byte scan of <= 10 MB, no decoding) .................   2 s
    #   photo upload, app.photos.total-timeout (all tries of one call) ................... 25 s
    #   model call, (connect 2 s + read 10 s) x (1 retry + 1) + 0.4 s pause ............. 24.4 s
    #   finalizing transaction, waiting for a pool connection (hikari default 30 s) ...... 30 s
    #   its two statements, budget .......................................................   1 s
    #   ------------------------------------------------------------------------------------------
    #   total ........................................................................... 82.4 s
    # 90 s leaves 7.6 s for pauses of the JVM and the host. A request that still outlives its claim cannot
    # do harm: its claim is fenced (claim_id), the unique index of diagnoses keeps one result, and its photo
    # object has a name of its own, so it never overwrites the new owner's. Not counted: the rate limiter and
    # the lookups, which run before the claim.
    claim-timeout: 90s
  meta:
    cache-ttl: 60s # how long GET /api/meta keeps the answer of the AI service
  rate-limit:
    diagnosis-per-minute: 5 # new diagnoses per user per minute, given back when we fail; there are no daily limits
    diagnosis-attempts-per-minute: 20 # attempts per user per minute, never given back (a retry storm guard for the AI)
    login-per-ip-per-minute: ${APP_RATE_LIMIT_LOGIN_PER_IP_PER_MINUTE:30} # login attempts per client address per minute
    login-per-account-per-minute: ${APP_RATE_LIMIT_LOGIN_PER_ACCOUNT_PER_MINUTE:10} # login attempts per account per minute
    register-per-ip-per-hour: ${APP_RATE_LIMIT_REGISTER_PER_IP_PER_HOUR:20} # sign-ups per client address per hour
    refresh-per-ip-per-minute: ${APP_RATE_LIMIT_REFRESH_PER_IP_PER_MINUTE:60} # token refreshes per client address per minute (logouts get their own bucket of the same size)
  security:
    jwt:
      # Base64, at least 32 random bytes (openssl rand -base64 48). Kept outside git; startup fails without it.
      secret: ${JWT_SECRET:}
    # Deletes refresh tokens that expired more than `retention` ago; used and revoked rows stay until then
    refresh-cleanup:
      enabled: ${APP_SECURITY_REFRESH_CLEANUP_ENABLED:true}
      cron: ${APP_SECURITY_REFRESH_CLEANUP_CRON:0 0 4 * * *} # Asia/Almaty
      retention: ${APP_SECURITY_REFRESH_CLEANUP_RETENTION:P7D}
      batch-size: ${APP_SECURITY_REFRESH_CLEANUP_BATCH_SIZE:1000}
    # A used refresh token presented again within this window gets a new pair (lost response); 0 = strict, max PT60S
    refresh-reuse-window: ${APP_SECURITY_REFRESH_REUSE_WINDOW:PT10S}
  # Browser origins of the admin web, comma separated (https://host[:port]); empty = no cross-origin access
  cors:
    allowed-origins: ${APP_CORS_ORIGINS:}
  # First administrator, created at startup when no admin exists; off by default, credentials only from the environment
  bootstrap-admin:
    enabled: ${APP_BOOTSTRAP_ADMIN_ENABLED:false}
    login: ${APP_BOOTSTRAP_ADMIN_LOGIN:}
    password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:}
    full-name: ${APP_BOOTSTRAP_ADMIN_FULL_NAME:Administrator}
    language: ${APP_BOOTSTRAP_ADMIN_LANGUAGE:ru}

management:
  health:
    redis:
      # Redis is an accelerator, not a dependency: without it the service degrades, so it must not turn health DOWN
      enabled: false
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true

# API docs are off unless a profile turns them on (local, test); they are not served in production
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
    path: /swagger-ui.html

server:
  port: ${SERVER_PORT:8080}
