# Local development against the Docker Compose stack from infra/ (see infra/README.md).
# Database settings are read from infra/.env, so passwords live in one place.
spring:
  config:
    import: optional:file:../../infra/.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB:agroadvisor}
    username: ${POSTGRES_USER:agroadvisor}
    password: ${POSTGRES_PASSWORD}

management:
  endpoint:
    health:
      show-details: always
