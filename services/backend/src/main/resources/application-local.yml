# Enable with -Dspring-boot.run.profiles=local; it is not active by default.
# Local development against the Docker Compose stack from infra/ (see infra/README.md).
# Database settings are read from infra/.env, so passwords live in one place.
spring:
  config:
    import: optional:file:../../infra/.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB:agroadvisor}
    username: ${POSTGRES_USER:agroadvisor}
    password: ${POSTGRES_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}

app:
  ai:
    # Local runs may use an ai-service with the placeholder model (AI_MODEL_KIND=placeholder)
    allow-placeholder: true
  cors:
    # The admin web dev server (Vite); other profiles allow no browser origin unless APP_CORS_ORIGINS is set
    allowed-origins: ${APP_CORS_ORIGINS:http://localhost:5173}
  photos:
    # The S3 port is set in infra/.env together with the container
    endpoint: ${S3_ENDPOINT:http://localhost:${S3_PORT:8333}}

management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        # Metrics (agroadvisor.ai.predict, ...) are readable over HTTP only locally, with an access token;
        # Prometheus and a separate management port are planned for staging
        include: health, info, metrics

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
