# Local development against the Docker Compose stack from infra/ (see infra/README.md).
# Database settings are read from infra/.env, so passwords live in one place.
spring:
  config:
    import: optional:file:../../infra/.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB:agroadvisor}
    username: ${POSTGRES_USER:agroadvisor}
    password: ${POSTGRES_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}

app:
  ai:
    # The real AI client arrives with B9; until then local runs use the placeholder model
    client: stub
  photos:
    # The S3 port is set in infra/.env together with the container
    endpoint: ${S3_ENDPOINT:http://localhost:${S3_PORT:8333}}

management:
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
