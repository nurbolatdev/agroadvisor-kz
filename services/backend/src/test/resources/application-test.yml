# Tests start their own PostgreSQL in a container (Testcontainers) — no local stack needed.
spring:
  jpa:
    show-sql: false

app:
  ai:
    client: stub
    allow-placeholder: true
  photos:
    # Test-only keys: the client connects lazily and tests replace the storage with a fake
    access-key: test-access-key
    secret-key: test-secret-key
    # The job is built by hand in the tests that exercise it; a running one would only scan a fake storage
    orphan-cleanup:
      enabled: false
  rate-limit:
    # The whole suite signs up from one MockMvc address; the limits themselves are tested in
    # AuthRateLimitIntegrationTest
    login-per-ip-per-minute: 100000
    login-per-account-per-minute: 100000
    register-per-ip-per-hour: 100000
    refresh-per-ip-per-minute: 100000
  security:
    # The job is built by hand in the test that exercises it; a running one could delete other tests' rows
    refresh-cleanup:
      enabled: false
    jwt:
      # Test-only secret (32+ bytes, Base64). Never used outside the test profile.
      secret: dGVzdC1vbmx5LWp3dC1zZWNyZXQtMzItYnl0ZXMtbWluaW11bS0wMTIzNDU2Nzg5

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
