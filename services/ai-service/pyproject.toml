[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agroadvisor-ai-service"
version = "0.1.0"
description = "Plant disease recognition service for AgroAdvisor KZ"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.4",
    "pillow>=10.4",
    "pyyaml>=6.0",
    "torch>=2.4",
    "torchvision>=0.19",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]
train = [
    "tensorboard>=2.17",
    "matplotlib>=3.9",
    "scikit-learn>=1.5",
    "tqdm>=4.66",
]

[tool.setuptools.packages.find]
include = ["app*", "ml*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
