name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/backend
    steps:
      # The whole repository is checked out on purpose: CatalogSeedTest reads
      # services/ai-service/ml/classes.yaml.
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Integration tests start PostgreSQL and Redis through Testcontainers (Docker is preinstalled).
      - name: Test
        run: ./mvnw -B test
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: services/backend/target/surefire-reports

  ai-service:
    name: ai-service
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/ai-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/ai-service/pyproject.toml
      # CPU-only PyTorch, same index and versions as the Dockerfile: the default Linux wheel pulls
      # ~2 GB of CUDA. Keep the pins in sync with the Dockerfile.
      - name: Install
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.14.1" "torchvision==0.29.1"
          pip install -e ".[dev,train]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q

  # Tells which parts of the repository a change touches. The workflow itself always runs, so every required
  # check reports a status; a job that an `if:` skips counts as passed. (`paths:` on the whole workflow would
  # leave the required checks pending forever.)
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ai: ${{ steps.filter.outputs.ai }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          filters: |
            ai:
              - 'services/ai-service/**'
              - 'infra/**'
              - '.github/workflows/ci.yml'
            backend:
              - 'services/backend/**'
              - 'infra/**'
              - '.github/workflows/ci.yml'

  # Builds the production image for linux/amd64 (the runner's own platform, the staging target) and checks
  # it starts. Real weights are not in git, so the smoke test runs the placeholder model.
  # Runs only when ai-service, infra or this workflow changed (see `changes`).
  ai-image:
    name: ai-image
    needs: changes
    if: needs.changes.outputs.ai == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MODEL_VERSION: effnet-b0-v1
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build --platform linux/amd64 -t agroadvisor-ai-service:ci services/ai-service
      - name: Python version
        run: |
          docker run --rm --platform linux/amd64 --entrypoint python agroadvisor-ai-service:ci \
            -c 'import sys; assert sys.version_info[:2] == (3, 12), sys.version'
      - name: Refuses to start without the model weights
        run: |
          # Exit code 3 is uvicorn's "application startup failed"; docker errors (125-127) or an import crash (1) must not pass
          set +e
          timeout 120 docker run --rm --platform linux/amd64 agroadvisor-ai-service:ci
          code=$?
          set -e
          [ "$code" -eq 3 ] || { echo "expected exit 3 (startup refused without weights), got $code"; exit 1; }
      - name: Serves /health with the placeholder model
        run: |
          docker run -d --name ai --platform linux/amd64 -p 8000:8000 \
            -e AI_MODEL_KIND=placeholder -e AI_REQUIRE_MODEL=false agroadvisor-ai-service:ci
          for i in $(seq 1 30); do
            curl -fsS --max-time 5 http://127.0.0.1:8000/health | grep -q '"status":"ok"' && exit 0
            sleep 2
          done
          docker logs ai
          exit 1
      # The published weights are public; fetch_weights checks their SHA-256 against model_card.json.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # A release is immutable, so the version is the whole key; a new model version means a new key.
      # The cache is saved only after a successful, checksum-verified fetch.
      - name: Restore the cached weights
        id: weights
        uses: actions/cache@v6.1.0
        with:
          path: services/ai-service/ml/weights/${{ env.MODEL_VERSION }}
          key: model-weights-${{ env.MODEL_VERSION }}
      - name: Fetch the published weights
        if: steps.weights.outputs.cache-hit != 'true'
        working-directory: services/ai-service
        run: |
          pip install certifi
          python -m ml.fetch_weights "$MODEL_VERSION"
      - name: Serves the real model (/health)
        run: |
          docker rm -f ai
          docker run -d --name ai --platform linux/amd64 -p 8000:8000 \
            -v "$PWD/services/ai-service/ml/weights:/srv/ml/weights:ro" agroadvisor-ai-service:ci
          for i in $(seq 1 30); do
            body=$(curl -fsS --max-time 5 http://127.0.0.1:8000/health) && break
            sleep 2
          done
          echo "$body"
          echo "$body" | grep -q '"model_version":"effnet-b0-v1"'
          echo "$body" | grep -q '"calibrated":true'
      # One real prediction through the image. The photo is a PlantVillage leaf (CC0 1.0, see docs/ai/dataset.md),
      # 256 px, no EXIF; the model gives potato__late_blight with about 0.91 on it, so the checks leave room
      # (class and confidence >= 0.70) and a retrained model must still pass them. A synthetic picture would
      # be refused as low_quality.
      - name: Predicts a known leaf (/predict)
        run: |
          code=$(curl -sS --max-time 60 -o predict.json -w '%{http_code}' \
            -F "image=@services/ai-service/tests/fixtures/smoke_leaf.jpg;type=image/jpeg" -F "crop=potato" \
            http://127.0.0.1:8000/predict)
          cat predict.json; echo
          [ "$code" = "200" ] || { echo "expected HTTP 200, got $code"; docker logs ai; exit 1; }
          jq -e --arg v "$MODEL_VERSION" '
            .status == "ok"
            and .top1.code == "potato__late_blight"
            and .top1.confidence >= 0.70
            and .model_version == $v
            and (.classes_version | type == "number")
            and (.inference_ms | type == "number")' predict.json

  # Builds the backend image for linux/amd64 (the runner's own platform, the staging target), checks that it
  # refuses to start without the prod settings, then starts it through infra/docker-compose.yml (profile app)
  # together with PostgreSQL, Redis and SeaweedFS. The AI service is not part of the profile: the backend
  # starts without it.
  # Runs only when the backend, infra or this workflow changed (see `changes`).
  backend-image:
    name: backend-image
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Throwaway values for the compose steps: the containers live only in this job.
    env:
      POSTGRES_PASSWORD: ci-postgres
      REDIS_PASSWORD: ci-redis
      S3_ACCESS_KEY: ci-access-key
      S3_SECRET_KEY: ci-secret-key
    steps:
      - uses: actions/checkout@v7
      # The tag is the `image:` of the backend service in infra/docker-compose.yml.
      - name: Build
        run: docker build --platform linux/amd64 -t agroadvisor-backend:local services/backend
      - name: Runs as a non-root user
        run: |
          uid=$(docker run --rm --platform linux/amd64 --entrypoint id agroadvisor-backend:local -u)
          echo "uid=$uid"
          [ "$uid" != 0 ]
      - name: Refuses to start without the prod settings
        run: |
          # ProdSettingsCheck exits with 1; docker errors (125-127) must not pass
          set +e
          out=$(timeout 120 docker run --rm --platform linux/amd64 agroadvisor-backend:local 2>&1)
          code=$?
          set -e
          echo "$out" | tail -n 5
          [ "$code" -eq 1 ] || { echo "expected exit 1 (startup refused without settings), got $code"; exit 1; }
          echo "$out" | grep -q 'missing environment variables: DB_URL'
      - name: Starts with the stack from infra (profile app)
        working-directory: infra
        run: |
          export JWT_SECRET="$(openssl rand -base64 48)"
          docker compose --profile app up -d --no-build backend
          status=""
          for i in $(seq 1 60); do
            status=$(docker inspect -f '{{.State.Health.Status}}' agroadvisor-backend)
            [ "$status" = healthy ] && break
            sleep 3
          done
          [ "$status" = healthy ] || { echo "backend is $status"; docker compose --profile app ps -a; exit 1; }
          curl -fsS --max-time 5 http://127.0.0.1:8080/actuator/health/liveness | grep -q '"status":"UP"'
          curl -fsS --max-time 5 -o /dev/null http://127.0.0.1:8080/api/regions
      - name: Logs on failure
        if: failure()
        working-directory: infra
        run: docker compose --profile app logs --no-color --tail 200

  admin-web:
    name: admin-web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/admin-web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/admin-web/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  mobile:
    name: mobile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Format
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
        env:
          CI: "true"
      # schema.d.ts must match docs/api/openapi.json (the backend half is checked by OpenApiExportTest)
      - name: Generated API types are up to date
        run: npm run gen:api && git diff --exit-code src/api/schema.d.ts
