name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/backend
    steps:
      # The whole repository is checked out on purpose: CatalogSeedTest reads
      # services/ai-service/ml/classes.yaml.
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Integration tests start PostgreSQL and Redis through Testcontainers (Docker is preinstalled).
      - name: Test
        run: ./mvnw -B test

  ai-service:
    name: ai-service
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/ai-service/pyproject.toml
      # CPU-only PyTorch (same index as the Dockerfile): the default Linux wheel pulls ~2 GB of CUDA.
      - name: Install
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install -e ".[dev,train]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
