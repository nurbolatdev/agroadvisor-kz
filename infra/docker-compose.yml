# Local development dependencies. Run from infra/: docker compose up -d
# Only prebuilt images with pinned versions; fixed container and volume names,
# so repeated runs reuse the same containers and data. See infra/README.md.
# Host port 5433 for Postgres: 5432 is often taken by a locally installed PostgreSQL.
name: agroadvisor

services:
  postgres:
    image: imresamu/postgis:16-3.5
    container_name: agroadvisor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agroadvisor}
      POSTGRES_USER: ${POSTGRES_USER:-agroadvisor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/.env}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    container_name: agroadvisor-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in infra/.env}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
    name: agroadvisor-postgres-data
  redis-data:
    name: agroadvisor-redis-data
