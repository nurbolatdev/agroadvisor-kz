# Local development dependencies. Run from infra/: docker compose up -d
# Only prebuilt images with pinned versions; fixed container and volume names,
# so repeated runs reuse the same containers and data. See infra/README.md.
# Host port 5433 for Postgres: 5432 is often taken by a locally installed PostgreSQL.
name: agroadvisor

services:
  postgres:
    image: imresamu/postgis:16-3.5
    container_name: agroadvisor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agroadvisor}
      POSTGRES_USER: ${POSTGRES_USER:-agroadvisor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/.env}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    container_name: agroadvisor-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in infra/.env}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    container_name: agroadvisor-seaweedfs
    restart: unless-stopped
    # All-in-one: master, volume, filer and S3 gateway in one process
    command: >
      server -dir=/data -ip.bind=0.0.0.0 -volume.max=0
      -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    configs:
      - source: s3-config
        target: /etc/seaweedfs/s3.json
    ports:
      - "${S3_PORT:-8333}:8333"
      - "${S3_FILER_PORT:-8888}:8888"
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot: creates the photo bucket and exits; rerunning is a no-op
  seaweedfs-init:
    image: chrislusf/seaweedfs:4.48
    container_name: agroadvisor-seaweedfs-init
    restart: "no"
    depends_on:
      seaweedfs:
        condition: service_healthy
    entrypoint: ["sh", "-c"]
    command:
      - >
        echo "s3.bucket.create -name ${S3_BUCKET:-diagnosis-photos}"
        | weed shell -master=seaweedfs:9333 2>&1 | grep -v "already exists" || true

configs:
  s3-config:
    content: |
      {
        "identities": [
          {
            "name": "backend",
            "credentials": [
              { "accessKey": "${S3_ACCESS_KEY:?set S3_ACCESS_KEY in infra/.env}",
                "secretKey": "${S3_SECRET_KEY:?set S3_SECRET_KEY in infra/.env}" }
            ],
            "actions": ["Admin", "Read", "Write", "List", "Tagging"]
          }
        ]
      }

volumes:
  postgres-data:
    name: agroadvisor-postgres-data
  redis-data:
    name: agroadvisor-redis-data
  seaweedfs-data:
    name: agroadvisor-seaweedfs-data
